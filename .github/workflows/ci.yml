name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

# Permissão padrão mínima para todos os jobs.
# O job diagnose recebe permissão adicional para comentar na PR.
permissions:
  contents: read

# Evita manter várias execuções antigas da mesma PR ou branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Sem cor e sem TTY: lint.log, tests.log e build.log precisam sair em texto
  # puro para o Job Summary e para o Pipeline Guardian.
  CI: "true"
  NO_COLOR: "1"
  FORCE_COLOR: "0"
  TERM: dumb

jobs:
  # ---------------------------------------------------------------------
  # quality — executa ESLint, preserva o exit code e publica o log mesmo
  # quando a verificação falha.
  # ---------------------------------------------------------------------
  quality:
    name: Quality (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          npm run lint 2>&1 | tee reports/lint.log

      - name: Upload lint log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-log
          path: reports/lint.log
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------
  # tests — executa os testes, preserva o exit code e publica o log mesmo
  # quando a suíte falha.
  # ---------------------------------------------------------------------
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          npm run test 2>&1 | tee reports/tests.log

      - name: Upload tests log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-log
          path: reports/tests.log
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------
  # build — executa o build, preserva o exit code e publica o log mesmo
  # quando o processo falha.
  # ---------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          npm run build 2>&1 | tee reports/build.log

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: reports/build.log
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------
  # docker-build — constrói a imagem de produção SEM publicar em lugar
  # nenhum. É o gate que pega o que lint, teste e build não pegam: um
  # Dockerfile quebrado, uma dependência que não instala na imagem, um
  # `frontend/dist` que não é gerado.
  #
  # Não usa credencial de registry nem do Railway: `docker build` local,
  # imagem descartada com o runner.
  # ---------------------------------------------------------------------
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `--progress=plain` mantém o log em texto puro — é ele que vai para o
      # Job Summary e para o Pipeline Guardian.
      - name: Build da imagem (sem push)
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          docker build --progress=plain -t copa-figurinhas:ci . 2>&1 | tee reports/docker.log

      - name: Upload docker log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-log
          path: reports/docker.log
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------
  # diagnose — executa o Pipeline Guardian mesmo quando lint, testes ou
  # build falham.
  #
  # O job é informativo: uma falha interna do agente não deve transformar
  # um pipeline tecnicamente saudável em falha.
  # ---------------------------------------------------------------------
  diagnose:
    name: Diagnose (Pipeline Guardian)
    needs:
      - quality
      - tests
      - build
      - docker-build

    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # O diagnóstico é informativo e não é um gate técnico.
    continue-on-error: true

    outputs:
      short_sha: ${{ steps.sha.outputs.short }}

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare input directory
        run: mkdir -p reports/input

      # Os downloads são best-effort. Caso um job tenha falhado antes de
      # publicar seu artefato, o agente ainda analisa os dados disponíveis.
      - name: Download lint log
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: lint-log
          path: reports/input

      - name: Download tests log
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: tests-log
          path: reports/input

      - name: Download build log
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: build-log
          path: reports/input

      - name: Download docker log
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: docker-log
          path: reports/input

      - name: Collect Pull Request diff
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          git diff \
            --no-color \
            --find-renames \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            > reports/input/pr.diff

      - name: Execute Pipeline Guardian
        env:
          # Token temporário do workflow.
          GITHUB_TOKEN: ${{ github.token }}

          # A chave é o que liga o modelo — e só este job a recebe. `quality`,
          # `tests`, `build`, `docker-build` e `ci-gate` não a veem: nenhum
          # deles chama a OpenAI, e um secret entregue a quem não precisa é
          # superfície de exposição de graça.
          #
          # A condição repete, no YAML, a regra que o GitHub já aplica a
          # `pull_request` vindo de fork (secrets não são entregues). Repetir é
          # de propósito: a regra fica visível para quem lê o workflow, e um
          # gatilho novo adicionado no futuro não passa a entregar a chave a
          # código não confiável por omissão.
          #
          # Sem a chave (fork, secret não cadastrado), o agente usa o
          # classificador determinístico e o diagnóstico continua saindo.
          OPENAI_API_KEY: >-
            ${{
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository)
              && secrets.OPENAI_API_KEY || '' }}
          #
          # As três abaixo NÃO são secrets: são configuração. Ficam vazias
          # quando a variável não existe no repositório, e é `openai-config.mjs`
          # quem resolve o padrão (`gpt-5-mini`, `low`, `2000`). O padrão não é
          # repetido aqui de propósito — dois lugares com o mesmo padrão viram
          # dois padrões diferentes na primeira vez que um deles mudar.
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
          OPENAI_MAX_OUTPUT_TOKENS: ${{ vars.OPENAI_MAX_OUTPUT_TOKENS }}

          # Dia 2: o canal do Discord substitui o comentário automático como
          # saída principal do diagnóstico. Com 'false', `upsertPullRequestComment`
          # entra em dry-run: o corpo do comentário ainda é gravado em
          # `reports/pr-comment.md` (e vai para os artefatos), mas nada é
          # publicado na Pull Request.
          #
          # Para voltar ao comportamento do Dia 1, restaure:
          #   ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'true' || 'false' }}
          AUTOMATION_ALLOW_PR_COMMENT: "false"

          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.head_ref || github.ref_name }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}

          DEPLOY_ENVIRONMENT: staging

          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}

        run: node automation/src/ci-diagnose.mjs

      # -----------------------------------------------------------------
      # Relatório de execução do pipeline.
      #
      # O workflow pós-deployment não roda quando o CI falha — e é justamente
      # quando o CI falha que alguém precisa do relatório. Ele nasce aqui, com
      # o MESMO modelo de execução, o MESMO HTML e as MESMAS regras do
      # relatório pós-deployment: a única diferença é o escopo (`ci`), que faz
      # as etapas de Railway, runtime e smoke test aparecerem como
      # `NOT REACHED` em vez de `UNKNOWN`.
      #
      # `if: always()` porque o valor está exatamente no caso em que um passo
      # anterior deste job falhou.
      # -----------------------------------------------------------------
      - name: Identificar o commit em análise
        id: sha
        if: ${{ always() }}
        shell: bash
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Gerar relatório de execução do pipeline
        if: ${{ always() }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

          # Os resultados REAIS dos jobs, um a um. Derivar tudo da conclusão
          # global do workflow apagaria a diferença entre "o lint reprovou" e
          # "o Docker reprovou" — que é a informação inteira do relatório.
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}

          # Mesma condição do step anterior, e pelo mesmo motivo: este é o
          # único job do workflow que vê a chave, e PR de fork não a recebe.
          OPENAI_API_KEY: >-
            ${{
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository)
              && secrets.OPENAI_API_KEY || '' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
          OPENAI_MAX_OUTPUT_TOKENS: ${{ vars.OPENAI_MAX_OUTPUT_TOKENS }}
        # Os artefatos baixados são texto NÃO CONFIÁVEL: são lidos, sanitizados
        # e citados. Nada deles é executado.
        run: node automation/src/pipeline-report.mjs --scope ci --ci-dir reports/input

      # Nome intermediário. O artefato final, com o nome previsível que a
      # documentação cita, sai do job `publish-pipeline-report` — que é quem
      # obtém a URL de download para o Job Summary.
      - name: Publicar arquivos do relatório de execução
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-execution-report-files-${{ steps.sha.outputs.short }}
          path: |
            reports/pipeline-execution-report.json
            reports/pipeline-execution-report.md
            reports/pipeline-execution-report.html
          if-no-files-found: warn
          retention-days: 30

      - name: Add diagnosis to Job Summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f reports/diagnosis.md ]; then
            cat reports/diagnosis.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Pipeline Guardian"
              echo
              echo "O diagnóstico não foi gerado."
              echo
              echo "Consulte os logs do job para identificar a falha."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnosis artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-guardian-diagnosis
          path: |
            reports/diagnosis.json
            reports/diagnosis.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload PR diff artifact
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-diff
          path: reports/input/pr.diff
          if-no-files-found: warn
          retention-days: 30

      # ChatOps — transporta o diagnóstico já produzido para o Discord.
      #
      # Roda por último de propósito: o Job Summary e os artefatos já foram
      # publicados quando este step começa. Se a notificação falhar, o
      # diagnóstico continua acessível — a notificação é um canal a mais, não
      # a única cópia.
      #
      # `continue-on-error: true` durante o laboratório: um webhook mal
      # configurado ou um backend fora do ar não pode reprovar o pipeline.
      # Quem decide o resultado do CI continua sendo o job `ci-gate`, a partir
      # de quality/tests/build — este step não entra nessa conta.
      - name: Notify Discord (ChatOps)
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('reports/diagnosis.json') != '' && vars.CHATOPS_ENDPOINT_URL != '' }}
        continue-on-error: true
        env:
          CHATOPS_ENDPOINT_URL: ${{ vars.CHATOPS_ENDPOINT_URL }}
          CHATOPS_TARGET: ${{ vars.CHATOPS_TARGET }}
          CHATOPS_SHARED_SECRET: ${{ secrets.CHATOPS_SHARED_SECRET }}
          CHATOPS_API_TOKEN: ${{ secrets.CHATOPS_API_TOKEN }}

          # Em Pull Request, `GITHUB_SHA` aponta para o merge commit e
          # `GITHUB_REF_NAME` vira `<numero>/merge`. O que interessa ao
          # diagnóstico é o commit e a branch de quem abriu a PR.
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: node automation/src/send-chatops-event.mjs

  # ---------------------------------------------------------------------
  # publish-pipeline-report — a saída legível da execução.
  #
  # Publica o relatório com nome previsível e deixa no Job Summary um resumo
  # CURTO com o link. O relatório inteiro NÃO vai para o Summary: o HTML é a
  # saída principal, e um Summary gigante compete com ele em vez de apontar
  # para ele.
  #
  # Não recebe secret nenhum — só move arquivos já sanitizados — e NÃO entra
  # em `ci-gate`. Publicar um relatório nunca pode transformar um CI reprovado
  # em aprovado.
  # ---------------------------------------------------------------------
  publish-pipeline-report:
    name: Publicar relatório de execução
    needs:
      - diagnose

    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    continue-on-error: true

    steps:
      - name: Baixar arquivos do relatório
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pipeline-execution-report-files-${{ needs.diagnose.outputs.short_sha }}
          path: reports

      - name: Publicar artefato final
        id: upload
        if: ${{ hashFiles('reports/pipeline-execution-report.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-execution-report-${{ needs.diagnose.outputs.short_sha }}
          path: |
            reports/pipeline-execution-report.json
            reports/pipeline-execution-report.md
            reports/pipeline-execution-report.html
          if-no-files-found: warn
          retention-days: 30

      - name: Resumo curto no Job Summary
        if: ${{ always() }}
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_NAME: pipeline-execution-report-${{ needs.diagnose.outputs.short_sha }}
        run: |
          REPORT=reports/pipeline-execution-report.json

          {
            echo "## 🧭 Relatório de execução do pipeline"
            echo

            if [ -f "$REPORT" ]; then
              # `node -e` em vez de `jq`: o Node já está garantido no runner e o
              # JSON é lido como dado, nunca interpolado no shell.
              node -e '
                const r = require("./reports/pipeline-execution-report.json");
                const e = r.pipelineExecution;
                const symbol = { success: "✓", failure: "✗", not_reached: "—", skipped: "○", unknown: "?" };
                const text = { success: "SUCCESS", failure: "FAILURE", not_reached: "NOT REACHED", skipped: "SKIPPED", unknown: "UNKNOWN" };
                console.log(`- **Resultado:** \`${e.overallStatus}\` · **primeira falha:** \`${e.firstFailedStage ?? "nenhuma"}\``);
                console.log(`- **Commit:** \`${String(e.commitSha).slice(0, 7)}\` · correlação \`${e.correlationStatus}\``);
                console.log(`- **Gate (${e.gate.type}):** \`${e.gate.status}\` — determinístico`);
                console.log(`- **Origem do diagnóstico:** ${e.usedFallback ? "classificador determinístico (`usedFallback: true`)" : "modelo (`usedFallback: false`)"}`);
                console.log("");
                console.log("```text");
                for (const s of e.stages) console.log(`${symbol[s.status]} ${text[s.status].padEnd(11)} ${s.label}`);
                console.log("```");
              '
            else
              echo "- O relatório não foi gerado nesta execução."
              echo "- O resultado do CI continua sendo o do job \`ci-gate\`, a partir dos exit codes dos jobs técnicos."
            fi

            echo
            if [ -n "$ARTIFACT_URL" ]; then
              echo "📄 **[Baixar o relatório HTML]($ARTIFACT_URL)** — abra \`pipeline-execution-report.html\` no navegador."
            else
              echo "📄 Relatório HTML no artefato \`$ARTIFACT_NAME\` desta execução."
            fi

            echo
            echo "> A explicação é **informativa**. Quem aprova ou reprova o CI é o job \`ci-gate\`, a partir dos exit codes de \`quality\`, \`tests\`, \`build\` e \`docker-build\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # ci-gate — resultado final do pipeline.
  #
  # Aguarda o diagnóstico terminar, mas decide o status exclusivamente
  # com base em quality, tests, build e docker-build.
  #
  # `publish-pipeline-report` NÃO está em `needs` de propósito: publicar um
  # relatório não é uma condição do resultado técnico, nos dois sentidos.
  # ---------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    needs:
      - quality
      - tests
      - build
      - docker-build
      - diagnose

    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check required jobs
        shell: bash
        run: |
          echo "quality:      ${{ needs.quality.result }}"
          echo "tests:        ${{ needs.tests.result }}"
          echo "build:        ${{ needs.build.result }}"
          echo "docker-build: ${{ needs.docker-build.result }}"
          echo "diagnose:     ${{ needs.diagnose.result }} (informativo)"

          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo
            echo "CI Gate: falhou."
            echo "Pelo menos um job técnico obrigatório não teve sucesso."
            exit 1
          fi

          echo
          echo "CI Gate: tudo verde."