# CopaFigurinhas — execução local da MESMA imagem que vai para o Railway.
#
# Um serviço só. Sem banco, sem cache, sem volume de persistência: os dados
# ficam em memória e são recriados a cada `docker compose up`.
#
#   docker compose build
#   docker compose up
#   curl http://localhost:3001/api/health
#   docker compose down

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: copa-figurinhas:local
    container_name: copa-figurinhas

    environment:
      NODE_ENV: production
      # Porta DENTRO do container. No Railway quem define isso é a plataforma.
      PORT: "${PORT:-3001}"
      # Mesmo domínio para API e frontend: o CORS não precisa liberar ninguém
      # de fora. Sobrescreva se for chamar a API de outra origem.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      # Metadados da release, expostos em /api/health e /api/version.
      APP_VERSION: ${APP_VERSION:-1.0.0}
      COMMIT_SHA: ${COMMIT_SHA:-local}

    # `HOST_PORT` só existe para o caso de a 3001 já estar ocupada na máquina
    # (por exemplo, por um `npm run dev` rodando em paralelo):
    #   HOST_PORT=3010 docker compose up --build
    ports:
      - "${HOST_PORT:-3001}:${PORT:-3001}"

    restart: unless-stopped

    # O mesmo script do HEALTHCHECK da imagem: um único critério de "saudável".
    healthcheck:
      test: ["CMD", "node", "backend/src/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
